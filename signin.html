<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Verceil Bank</title>
  <link rel="stylesheet" href="index.css?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ==========================================================================
       SIGN-IN PAGE SPECIFIC STYLING (VERCEIL BANK BRANDED)
       Mirrors the dark navy "auth-card" modal used on the homepage so the
       standalone page looks identical to the in-app Sign In modal.
       ========================================================================== */
    body.signin-page {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(2, 11, 46, 0.5) 0%, rgba(2, 11, 46, 0.5) 100%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center center / cover no-repeat;
      background-attachment: fixed;
    }

    .auth-hero-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    @keyframes authCardIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-card {
      position: relative;
      width: 520px;
      max-width: 90vw;
      max-height: 92vh;
      overflow-y: auto;
      background: linear-gradient(160deg, #0B1228 0%, #060B1A 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 0 60px rgba(37, 99, 235, 0.25), 0 24px 60px rgba(0, 0, 0, 0.55);
      padding: 32px;
      padding-bottom: max(32px, calc(32px + env(safe-area-inset-bottom)));
      box-sizing: border-box;
      animation: authCardIn 220ms ease-out;
    }

    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .auth-logo {
      font-weight: 800;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .auth-logo .accent { color: #ffffff; }
    .auth-logo .main { color: #2563EB; }
    .auth-close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      padding: 4px;
      text-decoration: none;
    }
    .auth-close-btn:hover { color: #ffffff; }

    .auth-card h1 {
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .auth-card p.auth-subtitle {
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
      line-height: 1.4;
      margin: 6px 0 24px;
    }

    .auth-field { margin-bottom: 20px; }
    .auth-field label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .auth-input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      background: rgba(18, 34, 74, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
    }
    .auth-input::placeholder { color: rgba(255, 255, 255, 0.35); }
    .auth-input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .auth-btn-primary {
      width: 100%;
      height: 56px;
      margin-top: 8px;
      background: #2563EB;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      transition: background-color 0.2s ease;
    }
    .auth-btn-primary:hover { background: #1D4ED8; }
    .auth-btn-primary:active { filter: brightness(0.92); }
    .auth-btn-primary:disabled { opacity: 0.7; cursor: default; }

    .auth-switch {
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      margin: 24px 0 0;
    }
    .auth-switch a {
      color: #2563EB;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    .auth-error {
      display: none;
      color: #f87171;
      font-size: 0.8rem;
      margin: 16px 0 0;
    }
    .auth-success {
      display: none;
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 0 16px;
    }

    /* Password field with show/hide eye icon */
    .auth-field-password { position: relative; }
    .auth-field-password .auth-input { padding-right: 48px; }
    .auth-toggle-eye {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .auth-toggle-eye:hover { color: #ffffff; }
    .auth-toggle-eye svg { width: 20px; height: 20px; }

    .auth-forgot-link {
      display: block;
      text-align: left;
      color: #2563EB;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin: 12px 0 24px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .auth-forgot-link:hover { text-decoration: underline; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .auth-btn-secondary {
      width: 100%;
      height: 56px;
      background: transparent;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .auth-btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
    .auth-btn-secondary svg { width: 18px; height: 18px; }

    /* Trust badge strip beneath the card, on top of the background image */
    .auth-trust-footer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2.5rem;
      padding: 0 1rem 2rem;
    }
    .auth-trust-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #ffffff;
    }
    .auth-trust-item svg {
      width: 20px;
      height: 20px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .auth-trust-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
    .auth-trust-sub { font-size: 0.75rem; color: #94a3b8; line-height: 1.3; }
  </style>
  <!-- Include Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="signin-page">

  <!-- SITE HEADER (matches homepage header) -->
  <header class="main-header">
    <div class="container nav-container">
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="logo">
        <span class="logo-text"><span class="logo-accent" style="color: #000000; font-weight: 900; margin-right: 0.05rem;">VERCEIL</span><span class="logo-main" style="color: #0044ff; font-weight: 900;">BANK</span></span>
        <img src="logo.png" alt="Verceil Bank" class="logo-image">
      </a>

      <div class="nav-actions">
        <a href="signin.html" class="btn btn-primary sign-in-btn">Sign in</a>
      </div>
    </div>
  </header>

  <!-- BACKGROUND HERO WITH CENTERED AUTH CARD -->
  <div class="auth-hero">
    <main class="auth-hero-main">
      <div class="auth-card">

        <div class="auth-header">
          <span class="auth-logo"><span class="accent">VERCEIL</span><span class="main">BANK</span></span>
          <a href="index.html" aria-label="Close" class="auth-close-btn">&times;</a>
        </div>

        <h1>Sign in</h1>
        <p class="auth-subtitle">Access your Verceil Bank dashboard.</p>

        <div id="errorBanner" class="auth-error"></div>
        <div id="successBanner" class="auth-success">Successful login! Launching secure session...</div>

        <form id="signinForm">

          <div class="auth-field">
            <label for="username">Email address</label>
            <input type="email" id="username" class="auth-input" autocomplete="email" required>
          </div>

          <div class="auth-field" style="margin-bottom:0;">
            <label for="password">Password</label>
            <div class="auth-field-password">
              <input type="password" id="password" class="auth-input" autocomplete="current-password" required>
              <button type="button" class="auth-toggle-eye" data-toggle-for="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <a href="#" class="auth-forgot-link">Forgot password?</a>
          </div>

          <button type="submit" id="submitBtn" class="auth-btn-primary">Sign in</button>
        </form>

        <div class="auth-divider">or</div>

        <button type="button" class="auth-btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect><circle cx="12" cy="16" r="1"></circle><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Sign in with passkey
        </button>

        <p class="auth-switch">New to Verceil Bank? <a href="signup.html">Create account</a></p>
      </div>
    </main>

    <!-- TRUST BADGE FOOTER -->
    <div class="auth-trust-footer">
      <div class="auth-trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>
          <span class="auth-trust-title" style="display:block;">Secure</span>
          <span class="auth-trust-sub" style="display:block;">FDIC insured</span>
        </span>
      </div>
      <div class="auth-trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v6c0 5 3.5 8.5 9 10 5.5-1.5 9-5 9-10V5l-9-3-9 3z"/></svg>
        <span>
          <span class="auth-trust-title" style="display:block;">Privacy</span>
          <span class="auth-trust-sub" style="display:block;">Your data is protected</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Generated at build time by scripts/generate-config.js; sets window.SUPABASE_URL / window.SUPABASE_ANON_KEY -->
  <script src="js/config.js"></script>
  <script>
    // Populated by js/config.js (generated at build time from SUPABASE_URL /
    // SUPABASE_ANON_KEY env vars -- see scripts/generate-config.js).
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error('Supabase initialization error:', err);
    }

    const signinForm = document.getElementById('signinForm');
    const errorBanner = document.getElementById('errorBanner');
    const successBanner = document.getElementById('successBanner');
    const submitBtn = document.getElementById('submitBtn');

    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      successBanner.style.display = 'none';

      if (!supabaseClient) {
        errorBanner.textContent = 'Network configuration error: Supabase failed to initialize.';
        errorBanner.style.display = 'block';
        return;
      }

      submitBtn.textContent = 'Authenticating...';
      submitBtn.disabled = true;

      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        successBanner.style.display = 'block';
        submitBtn.style.backgroundColor = '#059669';
        submitBtn.textContent = 'Success! Launching...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        errorBanner.textContent = 'Invalid login credentials.';
        errorBanner.style.display = 'block';
        submitBtn.textContent = 'Sign in';
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = '#2563EB';
      }
    });

    document.querySelectorAll('.auth-toggle-eye').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-toggle-for');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
