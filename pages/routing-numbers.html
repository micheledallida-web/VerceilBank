<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Routing & Account Numbers</div>
  </div>

  <div id="rnLockedView">
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg text-center">
      <div class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA] mb-[16px]">🔒 For your protection, sensitive account information requires verification.</div>
      <input id="rnVerifyPassword" type="password" placeholder="Confirm your password" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none mb-[10px]">
      <div id="rnVerifyError" class="hidden text-[12px] font-medium text-[#EF4444] mb-[10px]"></div>
      <button id="rnVerifyBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer">Verify & Show Numbers</button>
    </div>
  </div>

  <div id="rnUnlockedView" class="hidden">
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg mb-[16px]">
      <div class="flex items-center justify-between py-[10px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Routing Number</span><div class="flex items-center gap-[8px]"><span id="rnRoutingNumber" class="text-[14px] font-bold text-[#111827] dark:text-white"></span><button class="rn-copy text-[11px] font-semibold text-[#2563EB] cursor-pointer" data-target="rnRoutingNumber">Copy</button></div></div>
      <div class="flex items-center justify-between py-[10px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Checking Account Number</span><div class="flex items-center gap-[8px]"><span id="rnCheckingNumber" class="text-[14px] font-bold text-[#111827] dark:text-white"></span><button class="rn-copy text-[11px] font-semibold text-[#2563EB] cursor-pointer" data-target="rnCheckingNumber">Copy</button></div></div>
      <div class="flex items-center justify-between py-[10px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Savings Account Number</span><div class="flex items-center gap-[8px]"><span id="rnSavingsNumber" class="text-[14px] font-bold text-[#111827] dark:text-white"></span><button class="rn-copy text-[11px] font-semibold text-[#2563EB] cursor-pointer" data-target="rnSavingsNumber">Copy</button></div></div>
    </div>
    <button id="rnShareBtn" class="w-full h-[44px] rounded-[14px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[13px] font-semibold cursor-pointer mb-[16px]">Share Securely</button>

    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">DIRECT DEPOSIT INFORMATION</div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[14px]">
      <div class="flex justify-between py-[6px] text-[13px]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Bank Name</span><span class="font-semibold text-[#111827] dark:text-white">Verceil Bank</span></div>
      <div class="flex justify-between py-[6px] text-[13px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Routing Number</span><span id="rnDdRouting" class="font-semibold text-[#111827] dark:text-white"></span></div>
      <div class="flex justify-between py-[6px] text-[13px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Account Number</span><span id="rnDdAccount" class="font-semibold text-[#111827] dark:text-white"></span></div>
      <div class="flex justify-between py-[6px] text-[13px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Account Type</span><span class="font-semibold text-[#111827] dark:text-white">Checking</span></div>
    </div>
    <div class="flex gap-[8px]">
      <button id="rnDownloadFormBtn" class="flex-1 h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[12px] font-semibold cursor-pointer">Download Form</button>
      <button id="rnEmailFormBtn" class="flex-1 h-[42px] rounded-[12px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer">Email Form</button>
      <button id="rnPrintFormBtn" class="flex-1 h-[42px] rounded-[12px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer">Print</button>
    </div>
  </div>
</div>
