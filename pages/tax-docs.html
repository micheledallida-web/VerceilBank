<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Tax & Account Documents</div>
  </div>
  <div class="flex items-center gap-[8px] mb-[14px] overflow-x-auto" id="taxDocsTabs">
    <button data-doc="1099" class="tax-doc-tab flex-1 h-[38px] rounded-[12px] text-[11px] font-semibold cursor-pointer whitespace-nowrap">1099 Forms</button>
    <button data-doc="interest" class="tax-doc-tab flex-1 h-[38px] rounded-[12px] text-[11px] font-semibold cursor-pointer whitespace-nowrap">Interest</button>
    <button data-doc="investment_tax" class="tax-doc-tab flex-1 h-[38px] rounded-[12px] text-[11px] font-semibold cursor-pointer whitespace-nowrap">Inv. Tax</button>
    <button data-doc="archived" class="tax-doc-tab flex-1 h-[38px] rounded-[12px] text-[11px] font-semibold cursor-pointer whitespace-nowrap">Archived</button>
  </div>
  <button id="taxDocsGenerateBtn" class="w-full h-[44px] rounded-[14px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer mb-[14px]">+ Generate Document for Current Period</button>
  <div id="taxDocsList" class="flex flex-col gap-[10px]"></div>
