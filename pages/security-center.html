<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Security Center</div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">FACE ID / BIOMETRIC LOGIN</div>
  <div id="biometricCard" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]"></div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">PASSWORD & LOGIN</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div id="pwLoginEmail" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mb-[2px]"></div>
    <div id="pwLastChanged" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]"></div>
    <div class="flex flex-col gap-[8px]">
      <input id="pwNew" type="password" placeholder="New Password" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="pwConfirm" type="password" placeholder="Confirm New Password" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <div id="pwError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="pwUpdateBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Update Password</button>
    </div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">TWO-FACTOR AUTHENTICATION</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <select id="tfaMethod" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none mb-[10px]">
      <option value="sms">SMS</option>
      <option value="app">Authenticator App</option>
      <option value="email">Email</option>
      <option value="key">Security Key</option>
    </select>
    <div class="flex gap-[8px] mb-[8px]">
      <button id="tfaEnableBtn" class="flex-1 h-[40px] rounded-[12px] bg-[#2563EB] text-white text-[12px] font-semibold cursor-pointer">Enable</button>
      <button id="tfaDisableBtn" class="flex-1 h-[40px] rounded-[12px] bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer">Disable</button>
    </div>
    <div id="tfaStatus" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mb-[8px]"></div>
    <button id="tfaBackupBtn" class="w-full h-[40px] rounded-[12px] bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer">Generate Backup Codes</button>
    <div id="tfaBackupCodes" class="hidden mt-[8px] grid grid-cols-2 gap-[6px] text-[12px] font-mono text-[#111827] dark:text-white"></div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">TRUSTED DEVICES</div>
  <div id="trustedDevicesList" class="flex flex-col gap-[8px] mb-[16px]"></div>

  <div class="flex items-center justify-between mb-[8px]">
    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">LOGIN ACTIVITY</div>
    <button id="signOutAllDevicesBtn" class="text-[12px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">Sign Out All Devices</button>
  </div>
  <div id="loginActivityList" class="flex flex-col gap-[8px] mb-[16px]"></div>

  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg">
    <div class="flex items-center justify-between py-[8px]"><span class="text-[13px] text-[#111827] dark:text-white">Security Alerts</span><button class="sec-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="security_alerts_enabled"><span class="sec-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#111827] dark:text-white">Fraud Protection Settings</span><button class="sec-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="fraud_protection_enabled"><span class="sec-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#DC2626]">Lock Account</span><button class="sec-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="account_locked"><span class="sec-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
  </div>
</div>
