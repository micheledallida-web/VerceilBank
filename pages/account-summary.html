<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Account Summary</div>
  </div>

  <div class="grid grid-cols-2 gap-[10px] mb-[16px]">
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg"><div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA]">Total Deposits</div><div id="asTotalDeposits" class="text-[18px] font-bold text-[#111827] dark:text-white">$0.00</div></div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg"><div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA]">Total Investments</div><div id="asTotalInvestments" class="text-[18px] font-bold text-[#111827] dark:text-white">$0.00</div></div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg"><div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA]">Credit Card Balance</div><div id="asCreditBalance" class="text-[18px] font-bold text-[#111827] dark:text-white">$0.00</div></div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg"><div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA]">Available Cash</div><div id="asAvailableCash" class="text-[18px] font-bold text-[#111827] dark:text-white">$0.00</div></div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">ACCOUNTS</div>
  <div id="asAccountsList" class="flex flex-col gap-[10px] mb-[16px]"></div>

  <div class="action-tile-grid mb-[20px]">
    <button id="asQuickTransfer" class="action-tile"><svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"></path></svg><span>Transfer</span></button>
    <button id="asQuickSendMoney" class="action-tile"><svg viewBox="0 0 24 24"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg><span>Send Money</span></button>
    <button id="asQuickDeposit" class="action-tile"><svg viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg><span>Deposit</span></button>
    <button id="asQuickStatements" class="action-tile"><svg viewBox="0 0 24 24"><path d="M9 12h6M9 16h6M9 8h2M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z"></path></svg><span>Statements</span></button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">RECENT ACTIVITY</div>
  <div id="asRecentActivity" class="flex flex-col gap-[8px]"></div>
</div>
