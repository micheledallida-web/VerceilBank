<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Scheduled Payments</div>
  </div>

  <div class="flex gap-[8px] mb-[16px]">
    <button class="sched-tab-btn flex-1 h-[38px] rounded-[12px] text-[13px] font-semibold cursor-pointer bg-white text-[#111827]" data-tab="upcoming">Upcoming</button>
    <button class="sched-tab-btn flex-1 h-[38px] rounded-[12px] text-[13px] font-semibold cursor-pointer bg-white/15 text-white" data-tab="recurring">Recurring</button>
    <button class="sched-tab-btn flex-1 h-[38px] rounded-[12px] text-[13px] font-semibold cursor-pointer bg-white/15 text-white" data-tab="completed">Completed</button>
  </div>

  <div class="flex justify-end mb-[10px]">
    <button id="addScheduledToggleBtn" class="text-[13px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ New Scheduled Payment</button>
  </div>

  <div id="scheduledList" class="flex flex-col gap-[10px] mb-[20px]"></div>

  <div id="addScheduledForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
    <div class="flex flex-col gap-[14px]">
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Biller or Recipient</label>
        <input id="schedRecipient" type="text" placeholder="Name" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Amount</label>
        <input id="schedAmount" type="number" min="0.01" step="0.01" placeholder="$0.00" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Start Date</label>
        <input id="schedStartDate" type="date" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">End Date (optional)</label>
        <input id="schedEndDate" type="date" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Frequency</label>
        <select id="schedFrequency" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
          <option>One-time</option><option>Weekly</option><option>Biweekly</option><option>Monthly</option><option>Quarterly</option>
        </select>
      </div>
      <div id="schedFormError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="saveScheduledBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all">Save Scheduled Payment</button>
    </div>
  </div>
</div>
