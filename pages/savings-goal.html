<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">

  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Savings Goal</div>
  </div>
  <div class="text-[13px] font-normal text-white/80 dark:text-[#8E9CBA] mb-[20px] ml-[52px]">Create or manage goals for your High-Yield Savings account</div>

  <div class="flex items-center justify-between mb-[8px]">
    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">YOUR GOALS</div>
    <button id="sgAddGoalBtn" class="text-[13px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ New Goal</button>
  </div>

  <div id="sgGoalAddForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[14px]">
    <div class="flex flex-col gap-[10px]">
      <input id="sgGoalName" type="text" placeholder="Goal name (e.g. Emergency Fund)" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      <input id="sgGoalTarget" type="number" min="1" step="1" placeholder="Target amount" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      <input id="sgGoalCurrent" type="number" min="0" step="1" placeholder="Current progress (optional)" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      <input id="sgGoalDate" type="date" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
      <div id="sgGoalError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="sgSaveGoalBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all">Save Goal</button>
    </div>
  </div>

  <div id="sgGoalsList" class="flex flex-col gap-[10px]"></div>

</div>
