<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Linked Accounts</div>
  </div>

  <div class="flex items-center justify-between mb-[8px]"><div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">EXTERNAL BANKS</div><button id="laAddBankBtn" class="text-[12px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ Add</button></div>
  <div id="laExternalBanksList" class="flex flex-col gap-[8px] mb-[16px]"></div>

  <div class="flex items-center justify-between mb-[8px]"><div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">BROKERAGE ACCOUNTS</div><button id="laAddBrokerageBtn" class="text-[12px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ Add</button></div>
  <div id="laBrokerageList" class="flex flex-col gap-[8px] mb-[16px]"></div>

  <div class="flex items-center justify-between mb-[8px]"><div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">PAYMENT PROVIDERS</div><button id="laAddProviderBtn" class="text-[12px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ Add</button></div>
  <div id="laProvidersList" class="flex flex-col gap-[8px]"></div>

  <div id="laAddForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mt-[16px]">
    <div id="laAddFormTitle" class="text-[14px] font-semibold text-[#111827] dark:text-white mb-[10px]">Add linked account</div>
    <div class="flex flex-col gap-[8px]">
      <input id="laProviderName" type="text" placeholder="Provider / Institution Name" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="laIdentifier" type="text" placeholder="Account identifier / username" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <button id="laSaveBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save</button>
    </div>
  </div>
</div>
