<div class="min-h-full w-full bg-[#F8F9FB] dark:bg-[#060B14] pb-[40px]">

      <div class="absolute left-1/2 -translate-x-1/2 text-[16px] font-semibold text-[#0F172A] dark:text-white">Linked Accounts</div>
