<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div id="wireFormStep">
    <div class="flex items-center gap-3 mb-[16px]">
      <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Wire Transfer</div>
    </div>

    <div class="flex gap-[8px] mb-[16px]">
      <button class="wire-tab-btn flex-1 h-[38px] rounded-[12px] text-[13px] font-semibold cursor-pointer bg-white text-[#111827]" data-tab="domestic">Domestic</button>
      <button class="wire-tab-btn flex-1 h-[38px] rounded-[12px] text-[13px] font-semibold cursor-pointer bg-white/15 text-white" data-tab="international">International</button>
    </div>

    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
      <div class="flex flex-col gap-[14px]">
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Recipient Name</label>
          <input id="wireRecipientName" type="text" placeholder="Full name" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Bank Name</label>
          <input id="wireBankName" type="text" placeholder="Recipient's bank" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div id="wireDomesticFields" class="flex flex-col gap-[14px]">
          <div>
            <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Routing Number</label>
            <input id="wireRouting" type="text" inputmode="numeric" maxlength="9" placeholder="9-digit routing number" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          </div>
        </div>
        <div id="wireIntlFields" class="hidden flex-col gap-[14px]">
          <div>
            <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">SWIFT/BIC</label>
            <input id="wireSwift" type="text" placeholder="e.g. CHASUS33" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          </div>
          <div>
            <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">IBAN</label>
            <input id="wireIban" type="text" placeholder="International account number" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          </div>
          <div>
            <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Country</label>
            <input id="wireCountry" type="text" placeholder="Recipient's country" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          </div>
          <div>
            <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Currency</label>
            <input id="wireCurrency" type="text" placeholder="e.g. EUR" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          </div>
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Account Number</label>
          <input id="wireAccountNumber" type="text" placeholder="Recipient's account number" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Amount</label>
          <input id="wireAmount" type="number" min="0.01" step="0.01" placeholder="$0.00" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Purpose</label>
          <input id="wirePurpose" type="text" placeholder="Purpose of wire" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div id="wireFormError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
        <button id="wireReviewBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all">Review Wire</button>
      </div>
    </div>
  </div>

  <div id="wireReviewStep" class="hidden">
    <div class="flex items-center gap-3 mb-[20px]">
      <button data-action="back-to-form" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Wire Transfer Review</div>
    </div>
    <div id="wireReviewCard" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg divide-y divide-gray-100 dark:divide-white/[0.06]"></div>
    <div id="wireReviewError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[12px]"></div>
    <button id="wireSubmitBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all mt-[16px]">Submit Wire</button>
  </div>
</div>
