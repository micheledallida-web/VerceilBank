<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Travel Notification</div>
  </div>

  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
    <div class="flex flex-col gap-[12px]">
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Destination Country</label>
        <input id="travelDestination" type="text" placeholder="e.g. France" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none">
      </div>
      <div class="flex gap-[10px]">
        <div class="flex-1"><label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Departure</label><input id="travelDeparture" type="date" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none"></div>
        <div class="flex-1"><label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Return</label><input id="travelReturn" type="date" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none"></div>
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Cards Traveling With</label>
        <div class="flex gap-[14px] text-[13px] text-[#111827] dark:text-white"><label class="flex items-center gap-[6px]"><input id="travelCardDebit" type="checkbox" checked> Debit</label><label class="flex items-center gap-[6px]"><input id="travelCardCredit" type="checkbox"> Credit</label></div>
      </div>
      <div class="flex gap-[10px]">
        <div class="flex-1"><label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Contact Phone</label><input id="travelPhone" type="tel" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none"></div>
        <div class="flex-1"><label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Email</label><input id="travelEmail" type="email" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none"></div>
      </div>
      <div class="flex flex-col gap-[8px] text-[13px] text-[#111827] dark:text-white pt-[6px] border-t border-gray-100 dark:border-white/[0.06]">
        <label class="flex items-center gap-[8px]"><input id="travelIntl" type="checkbox" checked> Enable International Transactions</label>
        <label class="flex items-center gap-[8px]"><input id="travelAtm" type="checkbox" checked> ATM Access Abroad</label>
        <label class="flex items-center gap-[8px]"><input id="travelFraud" type="checkbox" checked> Fraud Monitoring</label>
      </div>
      <div id="travelError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="travelSubmitBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer">Activate Travel Notice</button>
    </div>
  </div>
</div>
