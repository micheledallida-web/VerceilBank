<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div id="disputeFormStep">
    <div class="flex items-center gap-3 mb-[16px]">
      <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Dispute a Transaction</div>
    </div>

    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">SELECT A TRANSACTION</div>
    <div id="disputeTxList" class="flex flex-col gap-[8px] mb-[16px] max-h-[260px] overflow-y-auto"></div>

    <div id="disputeFormWrap" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
      <div class="flex flex-col gap-[12px]">
        <div id="disputeSelectedTx" class="text-[13px] font-semibold text-[#111827] dark:text-white pb-[8px] border-b border-gray-100 dark:border-white/[0.06]"></div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Reason</label>
          <select id="disputeReason" class="w-full h-[44px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none">
            <option>Unauthorized Transaction</option>
            <option>Duplicate Charge</option>
            <option>Incorrect Amount</option>
            <option>Merchandise Not Received</option>
            <option>Service Not Provided</option>
            <option>ATM Issue</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Description</label>
          <textarea id="disputeDescription" rows="4" placeholder="Describe what happened" class="w-full px-[14px] py-[10px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none"></textarea>
        </div>
        <div id="disputeError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
        <button id="disputeReviewBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer">Review Dispute</button>
      </div>
    </div>
  </div>

  <div id="disputeReviewStep" class="hidden">
    <div class="flex items-center gap-3 mb-[20px]">
      <button data-action="back-to-form" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Dispute Review</div>
    </div>
    <div id="disputeReviewRows" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg divide-y divide-gray-100 dark:divide-white/[0.06]"></div>
    <div id="disputeSubmitError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[12px]"></div>
    <button id="disputeSubmitBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer mt-[16px]">Submit Dispute</button>
  </div>
</div>
