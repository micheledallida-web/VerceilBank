<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[20px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Pay Bills</div>
  </div>

  <div class="flex items-center justify-between mb-[10px]">
    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase">Saved Billers</div>
    <button id="addBillerToggleBtn" class="text-[13px] font-semibold text-white dark:text-[#3B82F6] cursor-pointer">+ Add Biller</button>
  </div>
  <div id="billersList" class="flex flex-col gap-[10px] mb-[20px]"></div>

  <div id="addBillerForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg mb-[20px]">
    <div class="flex flex-col gap-[14px]">
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Company Name</label>
        <input id="billerCompanyName" type="text" placeholder="e.g. Con Edison" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Account Number</label>
        <input id="billerAccountNumber" type="text" placeholder="Your account number with this biller" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Category</label>
        <select id="billerCategory" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
          <option>Utilities</option><option>Internet</option><option>Mobile</option><option>Credit Cards</option><option>Insurance</option><option>Mortgage</option><option>Other</option>
        </select>
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Nickname (optional)</label>
        <input id="billerNickname" type="text" placeholder="e.g. Electric Bill" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div id="billerFormError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="saveBillerBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all">Save Biller</button>
    </div>
  </div>

  <div id="payBillForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
    <div id="payBillHeader" class="text-[15px] font-bold text-[#111827] dark:text-white mb-[14px]"></div>
    <div class="flex flex-col gap-[14px]">
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Amount</label>
        <input id="billPayAmount" type="number" min="0.01" step="0.01" placeholder="$0.00" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Payment Date</label>
        <input id="billPayDate" type="date" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Memo (optional)</label>
        <input id="billPayMemo" type="text" placeholder="Note" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
      </div>
      <div id="billPayError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="submitBillPayBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all">Submit Payment</button>
    </div>
  </div>
</div>
