<!-- ================= IDENTITY VERIFICATION (KYC) ================= -->
<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">

  <div class="flex items-center gap-3 mb-[10px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Verify Your Identity</div>
  </div>
  <div id="vfSubline" class="text-[13px] font-normal text-white/80 dark:text-[#8E9CBA] mb-[20px] ml-[52px]">We need this to open your account. Your information is encrypted and reviewed by a representative.</div>

  <!-- Status view — pending / verified / rejected. Filled by js/pages/verify.js -->
  <div id="vfStatusView" class="hidden"></div>

  <!-- Form view — the unverified state, and the rejected state after Resubmit -->
  <div id="vfFormView" class="hidden">

    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">PERSONAL INFORMATION</div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg mb-[20px]">
      <div class="flex flex-col gap-[14px]">

        <div>
          <label for="vfFirstName" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Legal first name</label>
          <input id="vfFirstName" type="text" autocomplete="given-name" placeholder="First name as it appears on your ID" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfLastName" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Legal last name</label>
          <input id="vfLastName" type="text" autocomplete="family-name" placeholder="Last name as it appears on your ID" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfDob" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Date of birth</label>
          <input id="vfDob" type="date" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfSsn" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Social Security Number</label>
          <input id="vfSsn" type="text" inputmode="numeric" autocomplete="off" placeholder="•••-••-••••" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          <div id="vfSsnError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[6px]"></div>
        </div>

      </div>
    </div>

    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">RESIDENTIAL ADDRESS</div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg mb-[8px]">
      <div class="flex flex-col gap-[14px]">

        <div>
          <label for="vfAddress1" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Street address</label>
          <input id="vfAddress1" type="text" autocomplete="address-line1" placeholder="123 Main Street" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfAddress2" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Apt / Unit (Optional)</label>
          <input id="vfAddress2" type="text" autocomplete="address-line2" placeholder="Apt 4B" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfCity" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">City</label>
          <input id="vfCity" type="text" autocomplete="address-level2" placeholder="City" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfState" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">State</label>
          <input id="vfState" type="text" autocomplete="address-level1" placeholder="State" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>

        <div>
          <label for="vfPostalCode" class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">ZIP code</label>
          <input id="vfPostalCode" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="12345" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
          <div id="vfPostalCodeError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[6px]"></div>
        </div>

      </div>
    </div>
    <div class="text-[12px] font-normal text-white/70 dark:text-[#8E9CBA] mb-[20px] px-[4px]">PO boxes cannot be accepted.</div>

    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">IDENTITY DOCUMENTS</div>
    <div class="flex flex-col gap-[10px] mb-[20px]">

      <div class="kyc-slot" data-slot="idFront">
        <input id="vfIdFront" class="kyc-slot-input" type="file" accept="image/*">
        <label for="vfIdFront" class="kyc-slot-label">
          <span class="kyc-slot-icon">
            <svg class="w-[20px] h-[20px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path stroke-linecap="round" d="M14 10h4M14 14h4M5 17c1.5-2 5-2 6.5 0"></path></svg>
          </span>
          <span class="kyc-slot-text">
            <span class="kyc-slot-title">Government ID — Front</span>
            <span class="kyc-slot-hint">Tap to upload a photo</span>
          </span>
        </label>
        <div class="kyc-slot-preview hidden">
          <img class="kyc-slot-thumb" alt="Government ID front preview">
          <span class="kyc-slot-filename"></span>
          <button type="button" class="kyc-slot-replace">Replace</button>
        </div>
        <div class="kyc-slot-error hidden"></div>
      </div>

      <div class="kyc-slot" data-slot="idBack">
        <input id="vfIdBack" class="kyc-slot-input" type="file" accept="image/*">
        <label for="vfIdBack" class="kyc-slot-label">
          <span class="kyc-slot-icon">
            <svg class="w-[20px] h-[20px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path stroke-linecap="round" d="M3 10h18M7 15h5"></path></svg>
          </span>
          <span class="kyc-slot-text">
            <span class="kyc-slot-title">Government ID — Back</span>
            <span class="kyc-slot-hint">Tap to upload a photo</span>
          </span>
        </label>
        <div class="kyc-slot-preview hidden">
          <img class="kyc-slot-thumb" alt="Government ID back preview">
          <span class="kyc-slot-filename"></span>
          <button type="button" class="kyc-slot-replace">Replace</button>
        </div>
        <div class="kyc-slot-error hidden"></div>
      </div>

      <div class="kyc-slot" data-slot="selfie">
        <input id="vfSelfie" class="kyc-slot-input" type="file" accept="image/*">
        <label for="vfSelfie" class="kyc-slot-label">
          <span class="kyc-slot-icon">
            <svg class="w-[20px] h-[20px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </span>
          <span class="kyc-slot-text">
            <span class="kyc-slot-title">Selfie holding your ID</span>
            <span class="kyc-slot-hint">Tap to upload a photo</span>
          </span>
        </label>
        <div class="kyc-slot-preview hidden">
          <img class="kyc-slot-thumb" alt="Selfie preview">
          <span class="kyc-slot-filename"></span>
          <button type="button" class="kyc-slot-replace">Replace</button>
        </div>
        <div class="kyc-slot-error hidden"></div>
      </div>

    </div>

    <div id="vfSubmitError" class="hidden text-[12px] font-medium text-[#EF4444] mb-[10px] px-[4px]"></div>

    <button id="vfSubmitBtn" type="button" disabled class="w-full h-[50px] rounded-[14px] bg-[#2563EB] text-white text-[15px] font-semibold cursor-pointer hover:opacity-90 transition-all shadow-lg flex items-center justify-center gap-[8px]">
      <span id="vfSubmitSpinner" class="kyc-spinner hidden"></span>
      <span id="vfSubmitLabel">Submit for Review</span>
    </button>

    <div class="flex items-center gap-[8px] mt-[24px] px-[4px]">
      <svg class="w-[16px] h-[16px] text-[#10B981] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3z"></path></svg>
      <span class="text-[12px] font-normal text-white/70 dark:text-[#8E9CBA]">Your documents are encrypted in transit and stored privately.</span>
    </div>

  </div>

</div>
