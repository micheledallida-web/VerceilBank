<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Account Details</div>
  </div>

  <div class="flex items-center gap-[8px] mb-[14px]" id="adAccountTabs">
    <button data-acct="checking" class="ad-acct-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Checking</button>
    <button data-acct="savings" class="ad-acct-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Savings</button>
    <button data-acct="investments" class="ad-acct-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Investments</button>
  </div>

  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div id="adAccountInfo" class="flex flex-col gap-[8px] text-[13px] mb-[14px]"></div>
    <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Account Nickname</label>
    <input id="adNickname" type="text" placeholder="e.g. Everyday Spending" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none mb-[10px]">
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#111827] dark:text-white">Set as Default Account</span><button class="ad-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="is_default"><span class="ad-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#111827] dark:text-white">Paperless Statements</span><button class="ad-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="paperless"><span class="ad-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#111827] dark:text-white">Notifications for this Account</span><button class="ad-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="notifications"><span class="ad-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
  </div>

  <button id="adSaveBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer mb-[10px]">Save Changes</button>
  <button id="adCloseAcctBtn" class="w-full h-[46px] rounded-[14px] bg-white dark:bg-white/5 border border-[#DC2626] text-[#DC2626] text-[14px] font-semibold cursor-pointer">Request Account Closure</button>
</div>
