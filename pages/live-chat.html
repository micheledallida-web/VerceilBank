<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[16px] flex flex-col min-h-[100dvh]">
  <div class="flex items-center gap-3 mb-[8px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="min-w-0">
      <div class="text-[18px] font-bold text-white truncate">Live Chat</div>
      <div id="chatHeaderStatus" class="text-[11px] text-white/70">Connecting you with an agent...</div>
    </div>
  </div>

  <div class="flex items-center gap-[8px] mb-[10px] overflow-x-auto" id="chatQuickOptions">
    <button data-opt="Account Help" class="chat-quick-btn px-[12px] h-[30px] rounded-full bg-white dark:bg-[#0D1728] text-[11px] font-semibold text-[#111827] dark:text-white whitespace-nowrap cursor-pointer">Account Help</button>
    <button data-opt="Card Help" class="chat-quick-btn px-[12px] h-[30px] rounded-full bg-white dark:bg-[#0D1728] text-[11px] font-semibold text-[#111827] dark:text-white whitespace-nowrap cursor-pointer">Card Help</button>
    <button data-opt="Payment Help" class="chat-quick-btn px-[12px] h-[30px] rounded-full bg-white dark:bg-[#0D1728] text-[11px] font-semibold text-[#111827] dark:text-white whitespace-nowrap cursor-pointer">Payment Help</button>
    <button data-opt="Fraud Support" class="chat-quick-btn px-[12px] h-[30px] rounded-full bg-white dark:bg-[#0D1728] text-[11px] font-semibold text-[#111827] dark:text-white whitespace-nowrap cursor-pointer">Fraud Support</button>
    <button data-opt="Investment Support" class="chat-quick-btn px-[12px] h-[30px] rounded-full bg-white dark:bg-[#0D1728] text-[11px] font-semibold text-[#111827] dark:text-white whitespace-nowrap cursor-pointer">Investment Support</button>
  </div>

  <div id="chatMessages" class="flex-1 bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[18px] p-[14px] shadow-lg overflow-y-auto flex flex-col gap-[10px] mb-[10px]"></div>

  <div id="chatTypingIndicator" class="hidden items-center gap-[6px] mb-[6px] px-[4px]">
    <span class="text-[11px] text-white/70" id="chatTypingLabel">Agent is typing</span>
    <span class="flex gap-[2px]"><span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span></span>
  </div>

  <div class="flex gap-[8px] mb-[8px]">
    <input id="chatInput" type="text" placeholder="Type a message..." class="flex-1 h-[44px] px-[14px] rounded-[14px] bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] text-[13px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none">
    <button id="chatSendBtn" class="h-[44px] px-[16px] rounded-[14px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Send</button>
  </div>

  <div class="flex gap-[8px]">
    <button id="chatSaveTranscriptBtn" class="flex-1 h-[40px] rounded-[12px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer">Save Transcript</button>
    <button id="chatEndBtn" class="flex-1 h-[40px] rounded-[12px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#EF4444] text-[12px] font-semibold cursor-pointer">End Chat</button>
  </div>
</div>
