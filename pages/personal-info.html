<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Personal Information</div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">FULL LEGAL NAME</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]">🪪 Changing your legal name requires government ID verification.</div>
    <div class="grid grid-cols-3 gap-[8px] mb-[10px]">
      <input id="piFirstName" type="text" placeholder="First" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="piMiddleName" type="text" placeholder="Middle" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="piLastName" type="text" placeholder="Last" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
    </div>
    <input id="piIdUpload" type="file" accept="image/*,.pdf" class="w-full text-[11px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]">
    <button id="piSaveNameBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Name</button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">DATE OF BIRTH</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div class="text-[11px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]">🪪 Requires identity verification.</div>
    <input id="piDob" type="date" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none mb-[10px]">
    <button id="piSaveDobBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Date of Birth</button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">RESIDENTIAL ADDRESS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div class="flex flex-col gap-[8px] mb-[10px]">
      <input id="piResStreet" type="text" placeholder="Street Address" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="piResApt" type="text" placeholder="Apartment / Suite (optional)" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <div class="grid grid-cols-3 gap-[8px]">
        <input id="piResCity" type="text" placeholder="City" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <input id="piResState" type="text" placeholder="State" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <input id="piResZip" type="text" placeholder="ZIP" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      </div>
      <input id="piResCountry" type="text" placeholder="Country" value="United States" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
    </div>
    <button id="piSaveResBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Residential Address</button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">MAILING ADDRESS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <label class="flex items-center gap-[8px] text-[13px] text-[#111827] dark:text-white mb-[10px]"><input id="piMailSame" type="checkbox" checked> Same as Residential Address</label>
    <div id="piMailFields" class="hidden flex-col gap-[8px] mb-[10px]">
      <input id="piMailStreet" type="text" placeholder="Street Address" class="h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <div class="grid grid-cols-3 gap-[8px]">
        <input id="piMailCity" type="text" placeholder="City" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <input id="piMailState" type="text" placeholder="State" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <input id="piMailZip" type="text" placeholder="ZIP" class="h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      </div>
    </div>
    <button id="piSaveMailBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Mailing Address</button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">PHONE NUMBER</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div id="piPhoneStatus" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]">Not verified</div>
    <div class="flex gap-[8px] mb-[10px]">
      <input id="piPhoneCode" type="text" placeholder="+1" class="w-[60px] h-[42px] px-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="piPhoneNumber" type="tel" placeholder="Mobile number" class="flex-1 h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
    </div>
    <button id="piSendPhoneCodeBtn" class="w-full h-[40px] rounded-[12px] bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer mb-[8px]">Send Verification Code</button>
    <div id="piPhoneVerifyRow" class="hidden flex gap-[8px] mb-[8px]">
      <input id="piPhoneCodeInput" type="text" placeholder="6-digit code" class="flex-1 h-[40px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <button id="piVerifyPhoneBtn" class="px-[16px] h-[40px] rounded-[12px] bg-[#2563EB] text-white text-[12px] font-semibold cursor-pointer">Verify</button>
    </div>
    <button id="piSavePhoneBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Number</button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">EMAIL ADDRESS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg">
    <div id="piEmailStatus" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mb-[10px]">Not verified</div>
    <input id="piEmail" type="email" placeholder="you@example.com" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none mb-[10px]">
    <button id="piSendEmailCodeBtn" class="w-full h-[40px] rounded-[12px] bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[12px] font-semibold cursor-pointer mb-[8px]">Send Verification Email</button>
    <div id="piEmailVerifyRow" class="hidden flex gap-[8px] mb-[8px]">
      <input id="piEmailCodeInput" type="text" placeholder="6-digit code" class="flex-1 h-[40px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <button id="piVerifyEmailBtn" class="px-[16px] h-[40px] rounded-[12px] bg-[#2563EB] text-white text-[12px] font-semibold cursor-pointer">Verify</button>
    </div>
    <button id="piSaveEmailBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Save Email</button>
  </div>
</div>
