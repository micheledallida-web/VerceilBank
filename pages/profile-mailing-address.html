<div class="min-h-full w-full bg-[#F8F9FB] dark:bg-[#060B14] pb-[60px]">
  <div class="w-full bg-white dark:bg-[#0D1728] border-b border-[#E5E7EB] dark:border-white/[0.06]">
    <div class="w-full max-w-[430px] mx-auto px-[16px] h-[56px] flex items-center relative">
      <button data-action="back" class="w-[36px] h-[36px] flex items-center justify-center text-[#0F172A] dark:text-white cursor-pointer" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="absolute left-1/2 -translate-x-1/2 text-[16px] font-semibold text-[#0F172A] dark:text-white">Mailing Address</div>
    </div>
  </div>

  <div class="w-full max-w-[430px] mx-auto px-[20px] pt-[28px]">

    <div id="pdFormView">
      <div class="flex flex-col items-center text-center mb-[28px]">
        <span class="w-[72px] h-[72px] rounded-full bg-blue-50 flex items-center justify-center mb-[18px]">
          <svg class="w-[34px] h-[34px] text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 6.5l8.5 6.5 8.5-6.5"></path></svg>
        </span>
        <div class="text-[24px] font-bold text-[#0F172A] dark:text-white mb-[6px]">Mailing Address</div>
        <div class="text-[15px] text-[#6B7280] dark:text-[#8E9CBA]">View and update your mailing address.</div>
      </div>

      <div class="bg-white dark:bg-[#0D1728] rounded-[20px] border border-[#E5E7EB] dark:border-white/[0.06] shadow-sm p-[20px] mb-[24px]">
        <div class="mb-[20px]">
          <div class="text-[13px] font-bold uppercase tracking-[1.2px] text-[#6B7280] dark:text-[#8E9CBA] mb-[6px]">Current Mailing Address</div>
          <div id="pdCurrentMail" class="text-[16px] font-semibold text-[#0F172A] dark:text-white">Same as residential address</div>
        </div>

        <label class="flex items-center gap-[10px] mb-[16px] cursor-pointer">
          <input id="maSame" type="checkbox" checked class="w-[20px] h-[20px] accent-[#2563EB]">
          <span class="text-[15px] text-[#0F172A] dark:text-white">Same as residential address</span>
        </label>

        <div id="maFields" class="hidden flex-col gap-[14px]">
          <div>
            <label class="block text-[13px] font-medium text-[#6B7280] dark:text-[#8E9CBA] mb-[6px]">Street Address</label>
            <input id="maStreet" type="text" placeholder="Street Address" class="w-full h-[56px] px-[16px] rounded-[16px] bg-gray-50 dark:bg-white/5 border border-[#E5E7EB] dark:border-white/10 text-[16px] text-[#0F172A] dark:text-white outline-none focus:border-[#2563EB]">
          </div>
          <div class="grid grid-cols-2 gap-[12px]">
            <input id="maCity" type="text" placeholder="City" class="h-[56px] px-[16px] rounded-[16px] bg-gray-50 dark:bg-white/5 border border-[#E5E7EB] dark:border-white/10 text-[16px] text-[#0F172A] dark:text-white outline-none focus:border-[#2563EB]">
            <input id="maState" type="text" placeholder="State" class="h-[56px] px-[16px] rounded-[16px] bg-gray-50 dark:bg-white/5 border border-[#E5E7EB] dark:border-white/10 text-[16px] text-[#0F172A] dark:text-white outline-none focus:border-[#2563EB]">
          </div>
          <div>
            <input id="maZip" type="text" placeholder="ZIP Code" class="w-full h-[56px] px-[16px] rounded-[16px] bg-gray-50 dark:bg-white/5 border border-[#E5E7EB] dark:border-white/10 text-[16px] text-[#0F172A] dark:text-white outline-none focus:border-[#2563EB]">
          </div>
        </div>
      </div>

      <div class="bg-blue-50 dark:bg-white/5 rounded-[16px] p-[16px] mb-[28px]">
        <div class="text-[14px] font-semibold text-[#0F172A] dark:text-white mb-[6px]">Important Information</div>
        <div class="text-[13px] text-[#374151] dark:text-[#8E9CBA] leading-relaxed">Your mailing address is used for statements, cards, and other correspondence sent by mail.</div>
      </div>

      <div class="flex flex-col gap-[12px] pb-[20px]">
        <button id="pdSaveBtn" type="button" class="w-full h-[56px] rounded-[16px] bg-[#2563EB] text-white text-[16px] font-semibold cursor-pointer">Update Mailing Address</button>
        <button data-action="back" type="button" class="w-full h-[44px] text-[15px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] cursor-pointer">Cancel</button>
      </div>
    </div>

    <div id="pdConfirmView" class="hidden"></div>
  </div>
</div>
