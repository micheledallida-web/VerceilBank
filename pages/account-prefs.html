<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="text-[20px] font-bold text-white truncate">Account Preferences</div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">PUSH NOTIFICATIONS</div>
  <div id="pushPrefsCard" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]"></div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">EMAIL NOTIFICATIONS</div>
  <div id="emailPrefsCard" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]"></div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">SMS NOTIFICATIONS</div>
  <div id="smsPrefsCard" class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]"></div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">OTHER PREFERENCES</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[16px]">
    <div class="flex items-center justify-between py-[8px]"><span class="text-[13px] text-[#111827] dark:text-white">Paperless Statements</span><button class="pref-secondary-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="paperless_statements"><span class="pref-secondary-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="flex items-center justify-between py-[8px] border-t border-gray-100 dark:border-white/[0.06]"><span class="text-[13px] text-[#111827] dark:text-white">Marketing Communications</span><button class="pref-secondary-toggle w-[44px] h-[24px] rounded-full relative cursor-pointer" data-key="communication_marketing"><span class="pref-secondary-thumb absolute top-[3px] w-[18px] h-[18px] rounded-full bg-white transition-all"></span></button></div>
    <div class="py-[10px] border-t border-gray-100 dark:border-white/[0.06]">
      <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Language</label>
      <select id="apLanguage" class="w-full h-[40px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <option>English</option>
        <option>Español</option>
        <option>Français</option>
      </select>
    </div>
    <div class="py-[10px] border-t border-gray-100 dark:border-white/[0.06]">
      <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Default Payment Account</label>
      <select id="apDefaultAccount" class="w-full h-[40px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <option value="checking">Verceil Checking</option>
        <option value="savings">High-Yield Savings</option>
      </select>
    </div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">QUICK ACCESS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[8px] shadow-lg mb-[16px]">
    <button id="apManageLinkedBtn" class="w-full flex items-center justify-between px-[10px] py-[12px] rounded-[14px] hover:bg-gray-50 dark:hover:bg-white/5 transition-all cursor-pointer text-left">
      <span class="text-[14px] font-medium text-[#111827] dark:text-white">Manage Linked Accounts</span>
      <svg class="w-[16px] h-[16px] text-gray-400 dark:text-[#52607D]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <button id="apPrivacyBtn" class="w-full flex items-center justify-between px-[10px] py-[12px] rounded-[14px] hover:bg-gray-50 dark:hover:bg-white/5 transition-all cursor-pointer text-left border-t border-gray-100 dark:border-white/[0.06]">
      <span class="text-[14px] font-medium text-[#111827] dark:text-white">Privacy & Data</span>
      <svg class="w-[16px] h-[16px] text-gray-400 dark:text-[#52607D]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <button id="apSaveBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer">Save Preferences</button>
</div>
