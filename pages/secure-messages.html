<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Secure Messages</div>
  </div>

  <div class="flex items-center gap-[8px] mb-[14px]" id="msgsFolderTabs">
    <button data-folder="inbox" class="msgs-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Inbox</button>
    <button data-folder="sent" class="msgs-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Sent</button>
    <button data-folder="draft" class="msgs-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Drafts</button>
    <button data-folder="archived" class="msgs-tab flex-1 h-[36px] rounded-[10px] text-[12px] font-semibold cursor-pointer">Archived</button>
  </div>

  <button id="composeMsgBtn" class="w-full h-[44px] rounded-[14px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer mb-[14px]">+ Compose Message</button>

  <div id="composeMsgForm" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[14px]">
    <div class="flex flex-col gap-[10px]">
      <select id="msgCategory" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
        <option>Account Support</option>
        <option>Card Services</option>
        <option>Payments</option>
        <option>Fraud &amp; Security</option>
        <option>Investments</option>
        <option>Loans &amp; Credit</option>
        <option>General Inquiry</option>
      </select>
      <input id="msgSubject" type="text" placeholder="Subject" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none">
      <textarea id="msgBody" rows="4" placeholder="Your message" class="w-full px-[12px] py-[10px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none"></textarea>
      <input id="msgAttachment" type="file" accept=".pdf,image/*" class="w-full text-[12px] text-[#6B7280] dark:text-[#8E9CBA]">
      <div id="msgError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <div class="flex gap-[8px]">
        <button id="saveDraftBtn" class="flex-1 h-[42px] rounded-[12px] bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[13px] font-semibold cursor-pointer">Save Draft</button>
        <button id="sendMsgBtn" class="flex-1 h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Send Secure Message</button>
      </div>
    </div>
  </div>

  <div id="msgsList" class="flex flex-col gap-[10px]"></div>
</div>
