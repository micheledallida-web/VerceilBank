<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Verceil Bank</title>
  <link rel="stylesheet" href="index.css?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ==========================================================================
       SIGN-UP PAGE SPECIFIC STYLING (VERCEIL BANK BRANDED)
       ========================================================================== */
    body.signup-page {
      background: 
        linear-gradient(to bottom, #1e293b 0%, #0f172a 40%, rgba(15, 23, 42, 0.4) 55%, transparent 55%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat fixed !important;
      background-attachment: fixed !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    body.signup-page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.35);
      z-index: 1;
      pointer-events: none;
    }

    .signup-header, .signup-main, .signup-footer {
      position: relative;
      z-index: 2;
    }

    .signup-header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signup-header .logo {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 0.05rem !important;
      font-weight: 900 !important;
      font-size: 1.35rem !important;
      letter-spacing: -0.03em !important;
      text-transform: uppercase !important;
      text-decoration: none;
      background: transparent !important;
      padding: 0 !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .signup-header .logo-text {
      display: inline-flex !important;
      align-items: center !important;
    }

    .signup-header .logo-accent {
      color: #ffffff !important;
      font-weight: 900 !important;
      margin-right: 0.05rem;
    }

    .signup-header .logo-main {
      color: #3b82f6 !important;
      font-weight: 900 !important;
    }

    .exit-btn {
      color: #ffffff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .exit-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .signup-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1rem 3rem 1rem;
    }

    .signup-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .progress-container {
      margin-bottom: 1.75rem;
    }

    .progress-label {
      font-size: 0.85rem;
      color: #4b5563;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 75%;
      height: 100%;
      background: #0044ff;
      transition: width 0.4s ease-in-out;
    }

    .signup-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .signup-card p.subtitle {
      font-size: 0.95rem;
      color: #4b5563;
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 0.3rem;
      font-weight: 400;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 0.75rem 0;
      font-size: 1.05rem;
      border: none;
      border-bottom: 2px solid #0044ff;
      outline: none;
      background: transparent;
      color: #111827;
      border-radius: 0;
    }

    .input-group select {
      cursor: pointer;
    }

    .input-group input:focus, .input-group select:focus {
      border-bottom-color: #0033cc;
    }

    .btn-next-full {
      width: 100%;
      background-color: #0044ff;
      color: #ffffff;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 1rem;
    }

    .btn-next-full:hover {
      background-color: #0033cc;
    }

    .signup-footer {
      background-color: #ffffff;
      padding: 1.5rem 1rem;
      text-align: center;
      border-top: 1px solid #e5e7eb;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .error-msg {
      background-color: #fef2f2;
      border: 1px solid #f87171;
      color: #ef4444;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      display: none;
    }

    .success-msg {
      background-color: #ecfdf5;
      border: 1px solid #34d399;
      color: #059669;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      font-weight: 600;
      display: none;
    }
  </style>
  <!-- Include Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="signup-page">

  <!-- HEADER -->
  <header class="signup-header">
    <a href="index.html" class="logo">
      <span class="logo-text"><span class="logo-accent">VERCEIL</span><span class="logo-main">BANK</span></span>
    </a>
    <a href="index.html" class="exit-btn">Exit</a>
  </header>

  <!-- MAIN CARD CONTAINER -->
  <main class="signup-main">
    <div class="signup-card">
      
      <div class="progress-container">
        <span class="progress-label">Your information</span>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>

      <h1>Let's get to know you</h1>
      <p class="subtitle">Tell us your full legal name as it appears on your government ID, along with your secure credentials and date of birth.</p>

      <div id="errorBanner" class="error-msg"></div>
      <div id="successBanner" class="success-msg">Account created successfully! Launching dashboard...</div>

      <form id="signupForm">
        
        <div class="input-group">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" required>
        </div>

        <div class="input-group">
          <label for="middleName">Middle name (optional)</label>
          <input type="text" id="middleName">
        </div>

        <div class="input-group">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="input-group">
          <label for="suffix">Suffix (optional)</label>
          <select id="suffix">
            <option value="None">None</option>
            <option value="Jr">Jr.</option>
            <option value="Sr">Sr.</option>
            <option value="II">II</option>
            <option value="III">III</option>
          </select>
        </div>

        <div class="input-group">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" required>
        </div>

        <div class="input-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required>
        </div>

        <div class="input-group">
          <label for="password">Create password</label>
          <input type="password" id="password" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-next-full">Next</button>

      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="signup-footer">
    <p>© 2026 Verceil Bank, N.A. Member FDIC. Equal Housing Lender.</p>
  </footer>

  <script>
    // Configured with your exact Supabase credentials
    const SUPABASE_URL = 'https://kzykuuxoivrttfdjdypl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6eWt1dXhvaXZydHRmZGpkeXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDQ2NTcsImV4cCI6MjEwMTEyMDY1N30.qHHVx4J626WgTxirEsPVKC8xt-T0z44VyACVQRIPl00';
    
    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error('Supabase initialization error:', err);
    }

    const signupForm = document.getElementById('signupForm');
    const errorBanner = document.getElementById('errorBanner');
    const successBanner = document.getElementById('successBanner');
    const submitBtn = document.getElementById('submitBtn');
    const progressBarFill = document.getElementById('progressBarFill');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      successBanner.style.display = 'none';

      if (!supabaseClient) {
        errorBanner.textContent = 'Network configuration error: Supabase failed to initialize.';
        errorBanner.style.display = 'block';
        return;
      }

      submitBtn.textContent = 'Creating account...';
      submitBtn.disabled = true;
      progressBarFill.style.width = '100%';

      const firstName = document.getElementById('firstName').value.trim();
      const middleName = document.getElementById('middleName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const suffix = document.getElementById('suffix').value;
      const dob = document.getElementById('dob').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        errorBanner.textContent = 'Password should be at least 6 characters.';
        errorBanner.style.display = 'block';
        submitBtn.textContent = 'Next';
        submitBtn.disabled = false;
        progressBarFill.style.width = '75%';
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              first_name: firstName,
              middle_name: middleName,
              last_name: lastName,
              suffix: suffix,
              date_of_birth: dob
            }
          }
        });

        if (error) throw error;

        if (!data.session) {
          const loginRes = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          if (loginRes.error) throw loginRes.error;
        }

        successBanner.style.display = 'block';
        submitBtn.style.backgroundColor = '#059669';
        submitBtn.textContent = 'Success! Launching...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        let message = err.message || 'Load failed. Please check your network or try again.';
        if (message.toLowerCase().includes('invalid') || message.toLowerCase().includes('credentials') || message.toLowerCase().includes('already registered')) {
          message = 'Invalid registration details or email already in use.';
        }
        
        errorBanner.textContent = message;
        errorBanner.style.display = 'block';
        submitBtn.textContent = 'Next';
        submitBtn.disabled = false;
        progressBarFill.style.width = '75%';
      }
    });
  </script>
</body>
</html>
