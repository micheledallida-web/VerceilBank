<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Verceil Bank</title>
  <link rel="stylesheet" href="index.css?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ==========================================================================
       SIGN-UP PAGE SPECIFIC STYLING (VERCEIL BANK BRANDED)
       Mirrors the dark navy "auth-card" modal used on the homepage so the
       standalone page looks identical to the in-app Create Account modal.
       ========================================================================== */
    body.signup-page {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(2, 11, 46, 0.5) 0%, rgba(2, 11, 46, 0.5) 100%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center center / cover no-repeat;
      background-attachment: fixed;
    }

    .auth-hero-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    @keyframes authCardIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-card {
      position: relative;
      width: 400px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(160deg, #0B1228 0%, #060B1A 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.2), 0 16px 40px rgba(0, 0, 0, 0.5);
      padding: 22px;
      padding-bottom: max(22px, calc(22px + env(safe-area-inset-bottom)));
      box-sizing: border-box;
      animation: authCardIn 220ms ease-out;
    }

    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .auth-logo {
      font-weight: 800;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .auth-logo .accent { color: #ffffff; }
    .auth-logo .main { color: #2563EB; }
    .auth-close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      text-decoration: none;
    }
    .auth-close-btn:hover { color: #ffffff; }

    .auth-card h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .auth-card p.auth-subtitle {
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      line-height: 1.4;
      margin: 4px 0 16px;
    }

    .auth-progress { margin-bottom: 16px; }
    .auth-progress-label {
      display: block;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .auth-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .auth-progress-fill {
      height: 100%;
      background: #2563EB;
      border-radius: 999px;
      transition: width 0.4s ease-in-out;
    }

    .auth-field { margin-bottom: 12px; }
    .auth-field label {
      display: block;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .auth-input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background: rgba(18, 34, 74, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
    }
    .auth-input::placeholder { color: rgba(255, 255, 255, 0.35); }
    .auth-input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    select.auth-input {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      cursor: pointer;
    }
    input[type="date"].auth-input { color-scheme: dark; }

    .auth-btn-primary {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      background: #2563EB;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      transition: background-color 0.2s ease;
    }
    .auth-btn-primary:hover { background: #1D4ED8; }
    .auth-btn-primary:active { background: #1a46c4; }
    .auth-btn-primary:disabled { opacity: 0.7; cursor: default; }

    .auth-switch {
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      margin: 16px 0 0;
    }
    .auth-switch a {
      color: #2563EB;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    .auth-error {
      display: none;
      color: #f87171;
      font-size: 0.75rem;
      margin: 12px 0 0;
    }
    .auth-success {
      display: none;
      color: #34d399;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 0 0 12px;
    }

    /* Password field with show/hide eye icon */
    .auth-field-password { position: relative; }
    .auth-field-password .auth-input { padding-right: 40px; }
    .auth-toggle-eye {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .auth-toggle-eye:hover { color: #ffffff; }
    .auth-toggle-eye svg { width: 17px; height: 17px; }

    /* Trust badge strip beneath the card, on top of the background image */
    .auth-trust-footer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2.5rem;
      padding: 0 1rem 2rem;
    }
    .auth-trust-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #ffffff;
    }
    .auth-trust-item svg {
      width: 20px;
      height: 20px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .auth-trust-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
    .auth-trust-sub { font-size: 0.75rem; color: #94a3b8; line-height: 1.3; }

    /* Chase-style compact sizing on small/mobile screens */
    @media (max-width: 480px) {
      .auth-hero-main { padding: 16px 12px 24px; }
      .auth-card {
        width: 100%;
        max-width: 100%;
        padding: 18px;
        border-radius: 14px;
      }
      .auth-card h1 { font-size: 20px; }
    }
  </style>
  <!-- Include Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="signup-page">

  <!-- SITE HEADER (matches homepage header) -->
  <header class="main-header">
    <div class="container nav-container">
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="logo">
        <span class="logo-text"><span class="logo-accent" style="color: #000000; font-weight: 900; margin-right: 0.05rem;">VERCEIL</span><span class="logo-main" style="color: #0044ff; font-weight: 900;">BANK</span></span>
        <img src="logo.png" alt="Verceil Bank" class="logo-image">
      </a>

      <div class="nav-actions">
        <a href="signin.html" class="btn btn-primary sign-in-btn">Sign in</a>
      </div>
    </div>
  </header>

  <!-- BACKGROUND HERO WITH CENTERED AUTH CARD -->
  <div class="auth-hero">
    <main class="auth-hero-main">
      <div class="auth-card">

        <div class="auth-header">
          <span class="auth-logo"><span class="accent">VERCEIL</span><span class="main">BANK</span></span>
          <a href="index.html" aria-label="Close" class="auth-close-btn">&times;</a>
        </div>

        <h1>Create account</h1>
        <p class="auth-subtitle">Open your Verceil Bank account in just a few minutes.</p>

        <div class="auth-progress">
          <span class="auth-progress-label">Your information</span>
          <div class="auth-progress-track">
            <div class="auth-progress-fill" id="progressBarFill" style="width: 75%;"></div>
          </div>
        </div>

        <div id="errorBanner" class="auth-error"></div>
        <div id="successBanner" class="auth-success">Account created successfully! Launching dashboard...</div>

        <form id="signupForm">

          <div class="auth-field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" class="auth-input" required>
          </div>

          <div class="auth-field">
            <label for="middleName">Middle name (optional)</label>
            <input type="text" id="middleName" class="auth-input">
          </div>

          <div class="auth-field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" class="auth-input" required>
          </div>

          <div class="auth-field">
            <label for="suffix">Suffix (optional)</label>
            <select id="suffix" class="auth-input">
              <option value="">None</option>
              <option value="Jr">Jr.</option>
              <option value="Sr">Sr.</option>
              <option value="II">II</option>
              <option value="III">III</option>
            </select>
          </div>

          <div class="auth-field">
            <label for="dob">Date of birth</label>
            <input type="date" id="dob" class="auth-input" required>
          </div>

          <div class="auth-field">
            <label for="email">Email address</label>
            <input type="email" id="email" class="auth-input" required>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-field-password">
              <input type="password" id="password" class="auth-input" autocomplete="new-password" required>
              <button type="button" class="auth-toggle-eye" data-toggle-for="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-field" style="margin-bottom:0;">
            <label for="confirmPassword">Confirm password</label>
            <div class="auth-field-password">
              <input type="password" id="confirmPassword" class="auth-input" autocomplete="new-password" required>
              <button type="button" class="auth-toggle-eye" data-toggle-for="confirmPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="auth-btn-primary">Continue</button>

        </form>

        <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
      </div>
    </main>

    <!-- TRUST BADGE FOOTER -->
    <div class="auth-trust-footer">
      <div class="auth-trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v6c0 5 3.5 8.5 9 10 5.5-1.5 9-5 9-10V5l-9-3-9 3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>
          <span class="auth-trust-title" style="display:block;">Support</span>
          <span class="auth-trust-sub" style="display:block;">24/7 customer service</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Generated at build time by scripts/generate-config.js; sets window.SUPABASE_URL / window.SUPABASE_ANON_KEY -->
  <script src="js/config.js"></script>
  <script>
    // Populated by js/config.js (generated at build time from SUPABASE_URL /
    // SUPABASE_ANON_KEY env vars -- see scripts/generate-config.js).
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error('Supabase initialization error:', err);
    }

    const signupForm = document.getElementById('signupForm');
    const errorBanner = document.getElementById('errorBanner');
    const successBanner = document.getElementById('successBanner');
    const submitBtn = document.getElementById('submitBtn');
    const progressBarFill = document.getElementById('progressBarFill');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      successBanner.style.display = 'none';

      if (!supabaseClient) {
        errorBanner.textContent = 'Network configuration error: Supabase failed to initialize.';
        errorBanner.style.display = 'block';
        return;
      }

      const firstName = document.getElementById('firstName').value.trim();
      const middleName = document.getElementById('middleName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const suffix = document.getElementById('suffix').value;
      const dob = document.getElementById('dob').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 6) {
        errorBanner.textContent = 'Password should be at least 6 characters.';
        errorBanner.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorBanner.textContent = 'Passwords do not match.';
        errorBanner.style.display = 'block';
        return;
      }

      submitBtn.textContent = 'Creating account...';
      submitBtn.disabled = true;
      progressBarFill.style.width = '100%';

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              first_name: firstName,
              middle_name: middleName,
              last_name: lastName,
              suffix: suffix,
              date_of_birth: dob
            }
          }
        });

        if (error) throw error;

        if (!data.session) {
          const loginRes = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          if (loginRes.error) throw loginRes.error;
        }

        successBanner.style.display = 'block';
        submitBtn.style.backgroundColor = '#059669';
        submitBtn.textContent = 'Success! Launching...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        let message = err.message || 'Load failed. Please check your network or try again.';
        if (message.toLowerCase().includes('invalid') || message.toLowerCase().includes('credentials') || message.toLowerCase().includes('already registered')) {
          message = 'Invalid registration details or email already in use.';
        }

        errorBanner.textContent = message;
        errorBanner.style.display = 'block';
        submitBtn.textContent = 'Continue';
        submitBtn.disabled = false;
        progressBarFill.style.width = '75%';
      }
    });

    document.querySelectorAll('.auth-toggle-eye').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-toggle-for');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
